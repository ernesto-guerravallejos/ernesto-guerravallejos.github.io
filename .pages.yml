# Pages CMS configuration — https://pagescms.org
# Editing panel for Ernesto's website. Every save publishes to the live site in about a minute.

media:
  - name: images
    label: Images
    input: img
    output: img
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe
  - name: videos
    label: Videos
    input: videos
    output: videos
    extensions: [mp4, webm]
    rename: safe

content:
  - name: profile
    label: About me
    type: file
    path: data/profile.json
    format: json
    fields:
      - name: name
        label: Full name
        type: string
        required: true
        description: Shown at the top of the page, in the menu bar and in the browser tab.
      - name: headline
        label: Headline
        type: string
        description: The small blue line above your name. Separate items with " · " (space, middle dot, space).
      - name: photo
        label: Profile photo
        type: image
        description: A square or portrait photo works best (at least 800 px wide).
        options:
          media: images
          extensions: [jpg, jpeg, png, webp]
      - name: bio
        label: Bio
        type: rich-text
        description: Each paragraph here becomes a paragraph on the site. Use Bold for names you want to stand out.
        options:
          format: html
          media: false
          switcher: false
      - name: contact_email
        label: Contact email (as displayed)
        type: string
        description: Written as "name at gmail.com" so spam bots can't easily read it.
      - name: google_scholar_url
        label: Google Scholar profile link
        type: string
      - name: expertise
        label: Expertise
        type: string
        list: true
        description: One area per line. Drag to reorder.

  - name: publications
    label: Publications
    type: file
    path: data/publications.json
    format: json
    fields:
      - name: publications
        label: Publications
        type: object
        description: >-
          The first 5 papers marked "Selected" appear at the top, in this order (drag to reorder).
          All other papers appear below under "More Publications", newest first, 5 per page.
        list:
          collapsible: true
          collapsed: true
          summary: "{fields.year} · {fields.title}"
        fields:
          - name: featured
            label: Selected (show at the top)
            type: boolean
            default: false
          - name: title
            label: Title
            type: string
            required: true
          - name: authors
            label: Authors
            type: string
            description: Your name is bolded automatically.
          - name: journal
            label: Journal or conference
            type: string
          - name: year
            label: Year
            type: number
          - name: volume_pages
            label: Volume / pages
            type: string
            description: For example "Vol. 9, pp. 17365–17381" or "Vol. 15, Article 3448".
          - name: paper_url
            label: Link to the paper
            type: string
          - name: doi
            label: DOI
            type: string
            description: Just the code, for example 10.1109/ACCESS.2021.3051583
          - name: image
            label: Figure
            type: image
            description: >-
              A figure from the paper (crop out the caption first). Animated GIF or WebP also work
              and play automatically on the page.
            options:
              media: images
              extensions: [jpg, jpeg, png, webp, gif]
          - name: media_link
            label: Figure link (optional)
            type: string
            description: >-
              Web address to open when someone clicks the figure, e.g. a YouTube video or a project page.
              Leave empty to just open the figure in full size.
          - name: video
            label: Or upload a video (optional)
            type: file
            description: >-
              An MP4 hosted on this site. Used only if "Figure link" is empty. Keep it under 50 MB
              (for longer videos, upload to YouTube and use "Figure link" instead).
            options:
              media: videos
              extensions: [mp4, webm]
          - name: media_link_target
            label: Jump to a spot (optional)
            type: string
            description: >-
              Make the link land on a specific part of the destination. Write either an exact short
              phrase that appears on that page (e.g. Simulation results), a section id starting with #
              (e.g. #demo), or for a video a start time in seconds like #t=30.
          - name: media_link_label
            label: Link text (optional)
            type: string
            description: The word shown next to Paper · bibtex · DOI. Defaults to "Video".
          - name: description
            label: Short description
            type: text
          - name: bibtex
            label: BibTeX
            type: text
            description: Paste the full BibTeX entry. It appears when visitors click "bibtex".
